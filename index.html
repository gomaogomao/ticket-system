<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAZN販売コード申込フォーム</title><link rel="stylesheet" href="./style.css"></head><body><main class="page"><section class="card"><div class="eyebrow">TICKET APPLICATION</div><h1>DAZN販売コード申込フォーム</h1><p class="lead">必要事項をご入力ください。お申し込み内容を確認後、ご案内をメールでお送りします。</p><form id="f"><div class="field"><label>お名前 <span>*</span></label><input name="name" required></div><div class="field"><label>メールアドレス <span>*</span></label><input name="email" type="email" required></div><div class="field"><label>会社名・団体名</label><input name="company"></div><div class="field"><label>枚数 <span>*</span></label><input type="number" id="quantity" name="quantity" min="25" max="1000" step="1" value="25" required><p class="qty-help">25枚以上、1枚単位で入力してください（最大1,000枚）。</p></div><div class="field"><label>備考</label><textarea name="memo" rows="4"></textarea></div><button id="btn" class="primary">申し込む</button></form><div id="msg" hidden></div></section></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
