<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チケット申込</title><link rel="stylesheet" href="./style.css"></head><body><main class="page"><section class="card"><div class="eyebrow">TICKET APPLICATION</div><h1>チケット申込フォーム</h1><p class="lead">必要事項をご入力ください。ご入金確認後、QRチケットをメールでお送りします。</p><form id="f"><div class="field"><label>お名前 <span>*</span></label><input name="name" required></div><div class="field"><label>メールアドレス <span>*</span></label><input name="email" type="email" required></div><div class="field"><label>会社名・団体名</label><input name="company"></div><div class="field"><label>枚数 <span>*</span></label><select name="quantity"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><div class="field"><label>備考</label><textarea name="memo" rows="4"></textarea></div><button id="btn" class="primary">申し込む</button></form><div id="msg" hidden></div></section></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
