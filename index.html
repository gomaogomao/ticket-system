<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAZN販売コード申込フォーム</title><link rel="stylesheet" href="./style.css"></head><body><main class="page"><section class="card"><div class="eyebrow">TICKET APPLICATION</div><h1>DAZN販売コード申込フォーム</h1><p class="lead">必要事項をご入力ください。ご入金確認後、QRチケットをメールでお送りします。</p><form id="f"><div class="field"><label>お名前 <span>*</span></label><input name="name" required></div><div class="field"><label>メールアドレス <span>*</span></label><input name="email" type="email" required></div><div class="field"><label>会社名・団体名</label><input name="company"></div><div class="field"><label>枚数 <span>*</span></label><select name="quantity" required><option value="25">25枚</option><option value="30">30枚</option><option value="35">35枚</option><option value="40">40枚</option><option value="45">45枚</option><option value="50">50枚</option><option value="55">55枚</option><option value="60">60枚</option><option value="65">65枚</option><option value="70">70枚</option><option value="75">75枚</option><option value="80">80枚</option><option value="85">85枚</option><option value="90">90枚</option><option value="95">95枚</option><option value="100">100枚</option></select></div><div class="field"><label>備考</label><textarea name="memo" rows="4"></textarea></div><button id="btn" class="primary">申し込む</button></form><div id="msg" hidden></div></section></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
